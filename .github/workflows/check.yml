name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Session folder layout
        run: scripts/check-sessions.sh
      - name: Links between files
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
