name: Fix or update
description: Something in this repo is wrong, out of date, or missing
labels: ["content"]
body:
  - type: input
    id: where
    attributes:
      label: Which file or session?
      placeholder: sessions/2026-fall/2026-09-23-info-session/README.md
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What should change?
    validations:
      required: true
