<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bean Bash — arena</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* The projector page: a 3D canvas with a chunky, high-contrast overlay on top. */
      :root {
        --stage: #070b18;
        --glass: rgba(9, 13, 28, 0.78);
        --line: rgba(255, 255, 255, 0.16);
        font-family: ui-rounded, "SF Pro Rounded", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      body {
        height: 100dvh;
        overflow: hidden;
        background: var(--stage);
        color: #fff;
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Depth without postprocessing: a shade behind the question and a vignette at the edges. */
      .topShade,
      .vignette,
      #flash {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .topShade {
        height: 38vh;
        background: linear-gradient(rgba(7, 11, 24, 0.92), rgba(7, 11, 24, 0.55) 55%, transparent);
      }

      .vignette {
        background: radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(3, 5, 14, 0.7) 100%);
      }

      #flash {
        background: #fff;
        opacity: 0;
        transition: opacity 0.45s ease-out;
      }

      #flash.on {
        opacity: 0.32;
        transition: none;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 22px 30px;
        gap: 12px;
        pointer-events: none;
      }

      .overlay > * {
        pointer-events: auto;
      }

      header {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: clamp(1.3rem, 2.4vw, 2rem);
        font-weight: 900;
        letter-spacing: -0.03em;
      }

      .logo .dots {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px;
        width: 1.1em;
        height: 1.1em;
        transform: rotate(-8deg);
      }

      .logo .dots i {
        border-radius: 30%;
        background: var(--blue);
      }

      .logo .dots i:nth-child(2) {
        background: var(--red);
      }

      .logo .dots i:nth-child(3) {
        background: var(--yellow);
      }

      .logo .dots i:nth-child(4) {
        background: var(--green);
      }

      .spacer {
        flex: 1;
      }

      .pill {
        border: 2px solid var(--line);
        border-radius: 999px;
        background: var(--glass);
        padding: 0.35em 1em;
        font-weight: 800;
        font-size: clamp(0.9rem, 1.5vw, 1.35rem);
        white-space: nowrap;
        backdrop-filter: blur(6px);
      }

      #progress {
        align-self: center;
        margin-top: 1vh;
        font-size: clamp(0.8rem, 1.3vw, 1.1rem);
        font-weight: 900;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--yellow);
      }

      #question {
        align-self: center;
        max-width: 82vw;
        text-align: center;
        font-weight: 900;
        font-size: clamp(1.6rem, 4.3vw, 4.2rem);
        line-height: 1.06;
        letter-spacing: -0.02em;
        text-wrap: balance;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.45), 0 14px 40px rgba(0, 0, 0, 0.6);
      }

      .timerRow {
        align-self: center;
        display: flex;
        align-items: center;
        gap: 16px;
        width: min(760px, 62vw);
        margin-top: 0.4vh;
      }

      .timerRow .timerbar {
        flex: 1;
        height: 22px;
        border: 3px solid rgba(255, 255, 255, 0.85);
        background: rgba(0, 0, 0, 0.55);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      }

      .timerRow .timerbar > i {
        background: linear-gradient(90deg, var(--blue), var(--green));
        transition: transform 0.1s linear;
      }

      .timerRow .timerbar.low > i {
        background: var(--red);
        animation: throb 0.5s infinite alternate;
      }

      .timerRow .timerbar.reveal > i {
        background: var(--yellow);
      }

      @keyframes throb {
        to {
          filter: brightness(1.5);
        }
      }

      #timerText {
        min-width: 1.4em;
        font-size: clamp(1.4rem, 2.6vw, 2.4rem);
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        text-align: left;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
      }

      body:not([data-phase="question"]) #timerText,
      body:not([data-phase="question"]):not([data-phase="reveal"]) .timerRow {
        display: none;
      }

      /* Lobby: the join card. Big code, big QR, nothing else competing. */
      #joinPanel {
        position: relative;
        margin: 1vh auto 0;
        display: flex;
        align-items: center;
        gap: 30px;
        background: var(--glass);
        border: 2px solid var(--line);
        border-radius: 32px;
        padding: 26px 40px 26px 26px;
        backdrop-filter: blur(10px);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
        overflow: hidden;
        animation: rise 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }

      #joinPanel::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 8px;
        background: linear-gradient(90deg, var(--blue) 0 25%, var(--red) 25% 50%, var(--yellow) 50% 75%, var(--green) 75%);
      }

      #qr {
        width: clamp(150px, 16vw, 230px);
        aspect-ratio: 1;
        background: #fff;
        border-radius: 20px;
        padding: 12px;
        box-shadow: 0 10px 0 rgba(0, 0, 0, 0.35);
      }

      #qr svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .joinCopy {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .eyebrow {
        font-size: clamp(0.85rem, 1.4vw, 1.2rem);
        font-weight: 900;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        opacity: 0.7;
      }

      #code {
        font-size: clamp(3.5rem, 9vw, 7.5rem);
        font-weight: 900;
        letter-spacing: 0.06em;
        line-height: 0.95;
        text-shadow: 0 8px 0 rgba(0, 0, 0, 0.4);
      }

      #code .c0 {
        color: var(--blue);
      }
      #code .c1 {
        color: var(--red);
      }
      #code .c2 {
        color: var(--yellow);
      }
      #code .c3 {
        color: var(--green);
      }

      #joinUrl {
        align-self: flex-start;
        font-weight: 800;
        font-size: clamp(1rem, 1.7vw, 1.6rem);
        padding: 0.3em 0.9em;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid var(--line);
      }

      /* Winner screen. */
      #bigMessage {
        margin: 5vh auto 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.2em;
        text-align: center;
        animation: rise 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.25) both;
      }

      #bigMessage small {
        font-size: clamp(1rem, 2vw, 1.8rem);
        font-weight: 900;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--yellow);
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
      }

      #bigMessage strong {
        max-width: 90vw;
        font-size: clamp(3rem, 9vw, 8rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.03em;
        text-shadow: 0 10px 0 rgba(0, 0, 0, 0.45), 0 20px 60px rgba(66, 133, 244, 0.5);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.94);
        }
      }

      /* Host controls: there for the presenter, quiet for the room. */
      footer {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      footer button {
        font-size: 0.85rem;
        padding: 0.45em 0.9em;
        border: 2px solid var(--line);
        background: var(--glass);
        color: #fff;
        box-shadow: none;
        opacity: 0.55;
        transition: opacity 0.2s;
      }

      footer button:hover {
        opacity: 1;
      }

      footer button.off {
        opacity: 0.45;
      }

      footer button:active {
        transform: translateY(2px);
      }

      #alive {
        font-size: clamp(1rem, 1.7vw, 1.5rem);
        font-weight: 900;
        border-color: var(--green);
      }

      #alive:empty {
        display: none;
      }
    </style>
  </head>
  <body data-phase="lobby">
    <canvas id="scene"></canvas>
    <div class="topShade"></div>
    <div class="vignette"></div>
    <div id="flash"></div>
    <div class="overlay">
      <header>
        <div class="logo"><span class="dots"><i></i><i></i><i></i><i></i></span>Bean Bash</div>
        <div class="pill" id="counter">0 players</div>
        <div class="spacer"></div>
        <div class="pill" id="roomPill"></div>
      </header>

      <div id="progress" class="hidden"></div>
      <div id="question"></div>
      <div class="timerRow">
        <div class="timerbar hidden" id="timer"><i></i></div>
        <b id="timerText"></b>
      </div>

      <div id="joinPanel">
        <div id="qr"></div>
        <div class="joinCopy">
          <div class="eyebrow">Scan to join · room code</div>
          <div id="code"></div>
          <div id="joinUrl"></div>
        </div>
      </div>

      <div id="bigMessage" class="hidden"></div>

      <footer>
        <button data-cmd="start">Start (S)</button>
        <button data-cmd="next">Next (N)</button>
        <button data-cmd="revive">Revive all (R)</button>
        <button data-cmd="reset">New game (Esc)</button>
        <button id="muteBtn">Sound on (M)</button>
        <div class="spacer"></div>
        <div class="pill" id="alive"></div>
      </footer>
    </div>

    <script src="vendor/qrcode.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
    <script type="module" src="arena.js"></script>
  </body>
</html>
