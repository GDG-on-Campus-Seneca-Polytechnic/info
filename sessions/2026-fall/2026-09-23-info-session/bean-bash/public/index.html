<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Bean Bash</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: 12px;
        gap: 10px;
        /* The page is built for a phone; on a laptop it stays a phone-sized column. */
        max-width: 460px;
        margin: 0 auto;
      }

      @media (min-width: 700px) {
        body {
          border-left: 4px solid var(--ink);
          border-right: 4px solid var(--ink);
          background: #fff;
        }
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }

      .card {
        border: 4px solid var(--ink);
        border-radius: 22px;
        background: #fff;
        box-shadow: var(--shadow);
        padding: 16px;
      }

      input {
        font: inherit;
        font-weight: 700;
        width: 100%;
        padding: 0.7em;
        border: 3px solid var(--ink);
        border-radius: 14px;
      }

      .colors {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin: 10px 0 16px;
      }

      .colors button {
        padding: 8px;
        display: flex;
        justify-content: center;
        border-radius: 16px;
      }

      .colors button[aria-pressed="true"] {
        background: var(--ink);
      }

      .label {
        margin: 14px 0 8px;
        font-weight: 800;
      }

      .label:first-child {
        margin-top: 0;
      }

      #joinHint {
        color: var(--red);
        opacity: 1;
        min-height: 1.2em;
      }

      /* "This is you": name, colour and score, always visible while playing. */
      #meChip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px 6px 8px;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
        font-weight: 900;
      }

      #meChip .bean {
        --size: 26px;
        flex: none;
      }

      #meName {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #meScore {
        font-variant-numeric: tabular-nums;
      }

      #status {
        font-weight: 800;
        text-align: center;
        padding: 0.5em;
        border-radius: 999px;
        border: 3px solid var(--ink);
        background: #fff;
      }

      #question {
        font-weight: 800;
        font-size: 1.1rem;
        text-align: center;
      }

      #stage {
        position: relative;
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 10px;
        touch-action: none;
      }

      #stage .zone {
        font-size: 1rem;
      }

      #me {
        position: absolute;
        --size: 54px;
        left: 50%;
        top: 50%;
        margin-left: -27px;
        margin-top: -34px;
        transition: left 0.18s, top 0.18s;
        z-index: 5;
      }

      #me.dragging {
        transition: none;
        transform: scale(1.12);
      }

      .hint {
        text-align: center;
        font-weight: 700;
        opacity: 0.6;
        font-size: 0.85rem;
      }

      /* ---- waiting room ---- */

      #waitView {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        text-align: center;
      }

      #waitBean {
        --size: 92px;
        animation: idle 1.6s ease-in-out infinite;
      }

      @keyframes idle {
        0%,
        100% {
          transform: translateY(0) scaleY(1);
        }
        45% {
          transform: translateY(-14px) scaleY(1.06);
        }
        60% {
          transform: translateY(0) scaleY(0.94);
        }
      }

      #waitTitle {
        font-size: 1.6rem;
        font-weight: 900;
        margin: 0;
        letter-spacing: -0.02em;
      }

      #waitLine {
        font-weight: 700;
        margin: 0;
        opacity: 0.75;
      }

      .tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .tag {
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
        padding: 0.4em 0.9em;
        font-weight: 800;
      }

      .dots span {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin: 0 3px;
        border-radius: 50%;
        background: var(--ink);
        animation: blink 1.2s infinite;
      }

      .dots span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 0.2;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }

      #waitTip {
        max-width: 18em;
        font-weight: 700;
        opacity: 0.6;
        font-size: 0.9rem;
        margin: 0;
      }

      #changeBean {
        font-size: 0.9rem;
        padding: 0.5em 1.1em;
      }
    </style>
  </head>
  <body>
    <!-- Join -->
    <section id="joinView">
      <h1>Bean Bash</h1>
      <div class="card">
        <p class="label">Your name</p>
        <input id="nameInput" maxlength="14" placeholder="So you can find your bean" autocomplete="nickname" enterkeyhint="go" />
        <p class="label">Pick your bean</p>
        <div class="colors" id="colors"></div>
        <p class="label">Room code</p>
        <input id="roomInput" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD" />
        <div style="height: 14px"></div>
        <button id="joinBtn" style="width: 100%">Join the game</button>
        <p class="hint" id="joinHint"></p>
      </div>
    </section>

    <!-- Waiting room: between joining and the next question -->
    <section id="waitView" class="hidden">
      <div class="bean" id="waitBean"></div>
      <h2 id="waitTitle">You're in</h2>
      <p id="waitLine"></p>
      <div class="tags">
        <div class="tag" id="waitRoom"></div>
        <div class="tag" id="waitCount"></div>
        <div class="tag hidden" id="waitScore"></div>
      </div>
      <div class="dots"><span></span><span></span><span></span></div>
      <p id="waitTip"></p>
      <button id="changeBean">Change colour</button>
    </section>

    <!-- Game -->
    <section id="gameView" class="hidden" style="display: contents">
      <div id="meChip"><span class="bean" id="meBean"></span><span id="meName"></span><span id="meScore"></span></div>
      <div id="status">Waiting for the game to start</div>
      <div id="question"></div>
      <div class="timerbar" id="timer"><i></i></div>
      <div id="stage">
        <div class="zone" data-zone="0"></div>
        <div class="zone" data-zone="1"></div>
        <div class="zone" data-zone="2"></div>
        <div class="zone" data-zone="3"></div>
        <div class="bean" id="me"></div>
      </div>
      <p class="hint" id="hint">Drag your bean onto an answer</p>
    </section>

    <script src="phone.js"></script>
  </body>
</html>
