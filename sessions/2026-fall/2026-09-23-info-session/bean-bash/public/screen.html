<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bean Bash — big screen</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: 24px;
        gap: 18px;
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 3vw, 2.6rem);
        letter-spacing: -0.03em;
      }

      .spacer {
        flex: 1;
      }

      .pill {
        border: 4px solid var(--ink);
        border-radius: 999px;
        background: #fff;
        box-shadow: var(--shadow);
        padding: 0.35em 1em;
        font-weight: 800;
        font-size: clamp(1rem, 2vw, 1.6rem);
      }

      #joinPanel {
        display: flex;
        align-items: center;
        gap: 28px;
      }

      #qr {
        width: clamp(180px, 22vw, 300px);
        aspect-ratio: 1;
        border: 6px solid var(--ink);
        border-radius: 20px;
        background: #fff;
        padding: 10px;
      }

      #qr img,
      #qr canvas {
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }

      #code {
        font-size: clamp(3rem, 12vw, 9rem);
        font-weight: 900;
        letter-spacing: 0.08em;
        line-height: 1;
      }

      #joinUrl {
        font-weight: 800;
        font-size: clamp(1rem, 2vw, 1.8rem);
        opacity: 0.7;
      }

      #question {
        font-weight: 900;
        font-size: clamp(1.6rem, 4vw, 3.4rem);
        text-align: center;
        line-height: 1.1;
      }

      #zones {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 18px;
      }

      #zones .zone {
        font-size: clamp(1.2rem, 2.6vw, 2.4rem);
        flex-direction: column;
        gap: 10px;
      }

      .beans {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        align-items: flex-end;
        min-height: 60px;
      }

      .beanTag {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        transition: opacity 0.4s;
      }

      .beanTag span {
        font-size: 0.85rem;
        font-weight: 800;
        color: var(--ink);
        text-shadow: none;
        max-width: 90px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .beanTag.out {
        animation: tumble 0.7s ease-in forwards;
      }

      @keyframes tumble {
        to {
          transform: translateY(160px) rotate(220deg);
          opacity: 0;
        }
      }

      footer {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
      }

      #winners {
        text-align: center;
        font-size: clamp(2rem, 6vw, 5rem);
        font-weight: 900;
      }

      .gdgTag {
        font-size: clamp(0.7rem, 1.4vw, 1rem) !important;
      }

      .disclaimer {
        position: fixed;
        right: 16px;
        bottom: 4px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Bean Bash</h1>
      <div class="pill gdgTag">GDG on Campus · Seneca Polytechnic</div>
      <div class="pill" id="counter">0 players</div>
      <div class="spacer"></div>
      <div class="pill" id="roomPill"></div>
    </header>

    <section id="joinPanel">
      <div id="qr"></div>
      <div>
        <div id="code"></div>
        <div id="joinUrl"></div>
      </div>
      <div class="spacer"></div>
      <div class="beans" id="lobbyBeans"></div>
    </section>

    <section id="playPanel" class="hidden" style="display: contents">
      <div id="question"></div>
      <div class="timerbar" id="timer"><i></i></div>
      <div id="zones">
        <div class="zone" data-zone="0"><b></b><div class="beans"></div></div>
        <div class="zone" data-zone="1"><b></b><div class="beans"></div></div>
        <div class="zone" data-zone="2"><b></b><div class="beans"></div></div>
        <div class="zone" data-zone="3"><b></b><div class="beans"></div></div>
      </div>
    </section>

    <section id="overPanel" class="hidden">
      <div id="winners"></div>
      <div class="beans" id="winnerBeans"></div>
    </section>

    <footer>
      <button data-cmd="start">Start (S)</button>
      <button data-cmd="next">Next (N)</button>
      <button data-cmd="revive">Revive all (R)</button>
      <button data-cmd="reset">New game (Esc)</button>
      <div class="spacer"></div>
      <div id="alive"></div>
    </footer>

    <div class="disclaimer">GDG on Campus · Seneca Polytechnic is not affiliated with or endorsed by Google LLC.</div>

    <script src="vendor/qrcode.js"></script>
    <script src="screen.js"></script>
  </body>
</html>
